<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Black Stars Soccer Academy | Kiboga</title>

<meta name="description" content="Black Stars Soccer Academy Kiboga - developing young football talent, building champions and creating opportunities for boys and girls in Uganda.">

<style>
:root{
  --red:#e00000;
  --blue:#123de0;
  --gold:#ffd400;
  --black:#080808;
  --light:#f5f7fb;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  color:#111;
  background:var(--light);
  line-height:1.6;
}

a{
  text-decoration:none;
  color:inherit;
}

/* TOP CONTACT BAR */
.top{
  background:#080808;
  color:white;
  padding:9px 6%;
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
  font-size:14px;
}

/* NAVIGATION */
.nav{
  background:white;
  padding:10px 5%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:10;
  box-shadow:0 3px 12px #0002;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:900;
}

.brand img{
  width:62px;
  height:62px;
  object-fit:contain;
}

.brand span{
  color:var(--red);
}

.brand small{
  display:block;
  font-size:10px;
}

.links{
  display:flex;
  gap:18px;
  align-items:center;
  font-weight:700;
}

.links a:hover{
  color:var(--red);
}

/* BUTTONS */
.btn{
  display:inline-block;
  background:var(--red);
  color:white;
  padding:12px 20px;
  border-radius:28px;
  font-weight:800;
  border:0;
  cursor:pointer;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-2px);
  opacity:.9;
}

.btn.alt{
  background:white;
  color:#111;
  margin-left:8px;
}

/* HERO */
.hero{
  min-height:540px;
  background:
    linear-gradient(90deg,#000d,#0003),
    url('team4.jpg') center/cover;
  display:flex;
  align-items:center;
  padding:70px 7%;
  color:white;
}

.hero h1{
  font-size:clamp(42px,6vw,76px);
  line-height:.95;
  margin:0;
}

.hero h1 span{
  color:var(--gold);
}

.hero p{
  font-size:20px;
  max-width:650px;
}

/* INFORMATION STRIP */
.strip{
  margin:-35px 5% 30px;
  background:white;
  border-radius:18px;
  box-shadow:0 7px 25px #0002;
  padding:22px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.strip b{
  display:block;
  color:var(--red);
}

/* GENERAL SECTIONS */
section{
  padding:65px 7%;
}

.title{
  text-align:center;
  margin-bottom:35px;
}

.title h2{
  font-size:38px;
  margin:0;
}

.title span{
  color:var(--red);
}

.title p{
  color:#555;
}

/* CARDS */
.card{
  background:white;
  padding:28px;
  border-radius:18px;
  box-shadow:0 4px 18px #0001;
}

.card h2{
  margin-top:0;
  color:var(--red);
}

/* ABOUT */
.about{
  display:grid;
  grid-template-columns:1.2fr .8fr;
  gap:25px;
}

/* HISTORY */
.history{
  background:white;
}

.timeline{
  max-width:950px;
  margin:auto;
  position:relative;
}

.timeline::before{
  content:"";
  position:absolute;
  left:50%;
  top:0;
  bottom:0;
  width:4px;
  background:var(--red);
  transform:translateX(-50%);
}

.timeline-item{
  width:50%;
  padding:15px 35px;
  position:relative;
}

.timeline-item:nth-child(odd){
  left:0;
  text-align:right;
}

.timeline-item:nth-child(even){
  left:50%;
}

.timeline-item::after{
  content:"";
  position:absolute;
  top:25px;
  width:18px;
  height:18px;
  background:var(--gold);
  border:4px solid var(--red);
  border-radius:50%;
  z-index:2;
}

.timeline-item:nth-child(odd)::after{
  right:-12px;
}

.timeline-item:nth-child(even)::after{
  left:-12px;
}

.timeline-card{
  background:#f5f7fb;
  padding:22px;
  border-radius:16px;
  box-shadow:0 4px 15px #0001;
}

.timeline-card h3{
  color:var(--red);
  font-size:28px;
  margin:0 0 8px;
}

.timeline-card strong{
  color:var(--blue);
}

.history-highlight{
  max-width:900px;
  margin:35px auto 0;
  background:#111;
  color:white;
  padding:28px;
  border-radius:18px;
  text-align:center;
}

.history-highlight h3{
  color:var(--gold);
  margin-top:0;
}

/* PROGRAMS */
.programs{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}

.program{
  background:#111;
  color:white;
  border-radius:18px;
  padding:28px;
  text-align:center;
  border-bottom:6px solid var(--red);
  transition:.2s;
}

.program:hover{
  transform:translateY
